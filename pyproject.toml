[project]
name = "sec-analysis"
version = "0.1.0"
description = "Read-only securities analysis framework — research scaffolding, never places orders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sec-analysis contributors" }]
keywords = ["securities", "market-data", "research", "read-only"]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "feedparser>=6.0.11,<7",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.50"]
akshare = ["akshare>=1.16"]
ibkr = ["ib-insync>=0.9.86", "ibflex>=0.15"]
longbridge = ["longbridge>=4.0"]

[project.scripts]
sec-analysis = "sec_analysis.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
